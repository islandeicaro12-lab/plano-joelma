<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plano de Saúde de Joelma</title>
<meta name="description" content="Acompanhamento dos pagamentos e consultas do Plano de Saúde de Joelma.">
<meta http-equiv="refresh" content="3; url=https://claude.ai/artifact/HjPNKigPb2UNXsQ8m5jCVM">
<link rel="canonical" href="https://claude.ai/artifact/HjPNKigPb2UNXsQ8m5jCVM">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f6e66'/%3E%3Cpath d='M32 16v32M16 32h32' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f5f3ee;--ink:#1d2a2a;--muted:#6b7775;--teal:#0f6e66;--teal-2:#e3f1ef;--line:#e5e1d8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px 28px;max-width:440px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(15,110,102,.08)}
  .logo{width:64px;height:64px;border-radius:18px;background:var(--teal);display:grid;place-items:center;margin:0 auto 18px}
  h1{font-family:Fraunces,Georgia,serif;font-size:28px;margin:0 0 8px;letter-spacing:-.01em}
  p{color:var(--muted);margin:0 0 24px;line-height:1.5}
  .btn{display:inline-block;background:var(--teal);color:#fff;text-decoration:none;font-weight:600;padding:14px 26px;border-radius:12px;font-size:16px}
  .btn:hover{filter:brightness(1.08)}
  .bar{height:4px;background:var(--teal-2);border-radius:99px;overflow:hidden;margin:26px 0 10px}
  .bar i{display:block;height:100%;width:0;background:var(--teal);animation:load 3s linear forwards}
  @keyframes load{to{width:100%}}
  small{color:var(--muted);font-size:13px}
  ul{list-style:none;padding:0;margin:0 0 26px;display:grid;gap:8px;text-align:left}
  li{background:var(--teal-2);color:var(--teal);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600}
</style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
    <h1>Plano de Saúde de Joelma</h1>
    <p>Pagamentos, comprovantes e consultas de todos os membros em um só lugar.</p>
    <ul>
      <li>💠 Veja o PIX e o valor da sua parte</li>
      <li>📎 Envie seu comprovante com sua senha</li>
      <li>📅 Acompanhe as consultas</li>
    </ul>
    <a class="btn" id="go" href="https://claude.ai/artifact/HjPNKigPb2UNXsQ8m5jCVM">Abrir o app</a>
    <div class="bar"><i></i></div>
    <small>Abrindo automaticamente…</small>
  </main>
  <script>
    setTimeout(function(){ location.href = document.getElementById("go").href; }, 3000);
  </script>
</body>
</html>
